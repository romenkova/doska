packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAgeStrict: true
# My own package
minimumReleaseAgeExclude:
  - bakemd

allowBuilds:
  esbuild: true

# Dependabot advisory
overrides:
  # One React for the whole workspace, at the version Expo SDK 57 ships against.
  # Two copies gave the mobile app two @tanstack/react-query instances, so the
  # provider and the hooks in @doska/core saw different contexts.
  react: 19.2.3
  react-dom: 19.2.3
  brace-expansion: ^5.0.8
  postcss: ^8.5.18
  find-my-way: ^9.7.0
  fast-uri: ^3.1.4
  shell-quote: ^1.10.0
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  hono: ^4.12.32
  '@hono/node-server': ^2.0.12
  # drizzle-kit still pulls the deprecated @esbuild-kit chain, pinned to 0.18.
  esbuild@<0.24.3: ^0.25.12
  # xcode requires uuid from CommonJS, so it cannot take 14 like the rest of the
  # workspace. 11 is the newest line that still ships CJS.
  uuid@7: ^11.1.1
