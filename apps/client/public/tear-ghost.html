<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doska</title>
    <style>
      :root {
        --ghost-bg: #1c1c1f;
        --ghost-fg: #a1a1aa;
        --ghost-ring: rgb(255 255 255 / 0.1);
        --ghost-shadow: rgb(0 0 0 / 0.55);
      }
      :root.light {
        --ghost-bg: #fff;
        --ghost-fg: #71717a;
        --ghost-ring: rgb(0 0 0 / 0.08);
        --ghost-shadow: rgb(0 0 0 / 0.24);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      .ghost {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--ghost-bg);
        color: var(--ghost-fg);
        box-shadow:
          0 6px 18px var(--ghost-shadow),
          0 0 0 1px var(--ghost-ring);
      }
    </style>
  </head>
  <body>
    <div class="ghost">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" />
        <rect width="10" height="7" x="12" y="13" rx="2" />
      </svg>
    </div>
  </body>
</html>
