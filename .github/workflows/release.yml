name: Release Desktop

# Builds + signs the Tauri desktop app
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           output of `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password chosen for that key
#   APPLE_CERTIFICATE                   base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD          password set when exporting that .p12
#   APPLE_SIGNING_IDENTITY              "Developer ID Application: Name (K8DARP5MT7)"
#   APPLE_API_KEY                       App Store Connect key id, e.g. ABC123DEF4
#   APPLE_API_ISSUER                    the issuer uuid from the same Keys page
#   APPLE_API_KEY_P8                    base64 of the AuthKey_<id>.p8 file
#   HOMEBREW_TAP_TOKEN                  fine-grained PAT with contents: write on romenkova/homebrew-tap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The git tag is the single source of truth for the version
      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='apps/desktop/src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='$VERSION';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Stamped tauri.conf.json version = $VERSION"

      # tauri-bundler downloads a July 2024 linuxdeploy that bundles libwayland-client,
      # which breaks EGL on newer Mesa (Fedora 44+). Seed its cache with a newer one.
      # https://github.com/tauri-apps/tauri/issues/15976
      - name: Pin linuxdeploy
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: "${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Check AppImage does not bundle libwayland-client
        if: matrix.platform == 'ubuntu-latest'
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/appimage
          ./*.AppImage --appimage-extract > /dev/null
          if find squashfs-root -name 'libwayland-client.so*' | grep .; then
            echo "AppImage bundles libwayland-client, see tauri-apps/tauri#15976"
            exit 1
          fi

  homebrew:
    needs: release
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Bump cask in romenkova/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "Doska_${VERSION}_universal.dmg"
          SHA=$(sha256sum "Doska_${VERSION}_universal.dmg" | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/romenkova/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/doska.rb
          git diff --exit-code && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "doska ${VERSION}"
          git push
